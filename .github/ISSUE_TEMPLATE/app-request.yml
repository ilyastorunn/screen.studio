name: Suggest an app
description: Suggest an app for the screen.studio collection
title: "Add: "
labels: [app-request]
body:
  - type: input
    id: name
    attributes:
      label: App name
      placeholder: Focus Flow
    validations:
      required: true
  - type: input
    id: category
    attributes:
      label: Category
      placeholder: Productivity
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What makes this app worth featuring?
    validations:
      required: true
  - type: input
    id: app-store-url
    attributes:
      label: App Store URL
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshot URLs
      description: Add direct image URLs or attach images to this issue.
    validations:
      required: true
